# weirdnet-text release config for weirdnet-project-helpers (scripts/weirdnet_release.py).
# Usage: python3 scripts/weirdnet_release.py [--patch|--major|--version X.Y.Z] [--dry-run]
# Notes come from CHANGELOG.md `## [Unreleased]`; a message is optional.
helpers = "0.3.2"
project = "weirdnet-text"
next = ["docs.rs builds https://docs.rs/weirdnet-text/{version} from the crates.io upload"]

[[files]]
kind = "cargo-package"
paths = ["Cargo.toml"]
primary = true

[[files]]
kind = "cargo-lock"
path = "Cargo.lock"
packages = ["weirdnet-text"]

[changelog]
path = "CHANGELOG.md"

[checks]
commands = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked",
  "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps",
  "cargo package --locked --allow-dirty",
]

[crates]
publish = ["."]

[[platforms]]
os = "linux"
opt_out = "a library crate, published on crates.io; apps ship the binaries"

[[platforms]]
os = "macos"
opt_out = "a library crate, published on crates.io; apps ship the binaries"

[[platforms]]
os = "windows"
opt_out = "a library crate, published on crates.io; apps ship the binaries"

[[platforms]]
os = "android"
opt_out = "a library crate, published on crates.io; apps ship the binaries"

[[platforms]]
os = "ios"
opt_out = "a library crate, published on crates.io; apps ship the binaries"
